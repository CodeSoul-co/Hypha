# Candidate profile. It is intentionally separate from configs/memory-profiles.yaml
# until the pinned container completes the live acceptance gate.
schemaVersion: '1.0'
activeProfile: memorybank-hindsight-local
profiles:
  memorybank-hindsight-local:
    profile:
      id: memorybank-hindsight-local
      version: '1.0.0'
      revision: hindsight-0.8.5
      name: Hindsight Local MemoryBank
      enabled: false
      managementProviderRef:
        id: memory.provider.memorybank.hindsight-local
        version: '1.0.0'
        revision: hindsight-0.8.5
      recordStoreRef:
        id: memory.store.external.hindsight-local
        version: '1.0.0'
      scopePolicy:
        requiredDimensions: [userId]
        allowedReadScopes: [userId, workspaceId, sessionId, runId]
        allowedWriteScopes: [userId, workspaceId, sessionId, runId]
        crossUserRead: deny
        crossWorkspaceRead: deny
        enforceTenantBoundary: true
      retrievalPolicy:
        defaultMode: hybrid
        maxCandidates: 100
        defaultTopK: 10
        deduplication: hash
        conflictHandling: prefer_verified
        rerank: provider
      writePolicy:
        allowedTypes: [episodic, semantic, procedural, preference]
        deduplicateBeforeWrite: true
        conflictDetection: false
        sensitiveDataMode: reject
      retentionPolicy:
        retainHistory: true
        legalHoldSupported: false
        deletionMode: soft
      fallbackPolicy:
        onProviderUnavailable: fail
        onVectorUnavailable: fail
        onRerankerUnavailable: fail
        maxFallbackDepth: 0
      metadata:
        releaseStatus: candidate-live-acceptance-required
        topology: self-hosted
        upstream: vectorize-io/hindsight
        upstreamTag: v0.8.5
        imageTag: '0.8.5'
        imageDigest: sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb
    management:
      id: memory.provider.memorybank.hindsight-local
      version: '1.0.0'
      revision: hindsight-0.8.5
      type: memorybank
      deployment: self_hosted
      connectionRef: memory.connection.hindsight-local
      config:
        protocol: hindsight-http-v0.8
        expectedApiVersion: '0.8'
        mappingStoreRef: memory.mapping.durable
        operationStoreRef: memory.operation.durable
        operationDeadlineMs: 300000
        tlsTermination: hypha-gateway-or-loopback
      capabilities:
        add: true
        search: true
        get: true
        list: true
        update: true
        delete: true
        deleteByFilter: false
        history: true
        summarize: false
        consolidate: false
        decay: false
        reinforce: false
        conflictDetection: false
        hybridSearch: true
        graphRelations: false
        asyncWrite: true
        batchOperations: false
      metadata:
        releaseStatus: candidate-live-acceptance-required
        upstream: vectorize-io/hindsight
        upstreamTag: v0.8.5
        imageTag: '0.8.5'
        imageDigest: sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb
