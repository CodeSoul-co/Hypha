name: hypha-hindsight-local

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.5@sha256:0710076cd1539b4f89537d2e5b0ea1e4d179885bc12809a56cf748c538c8c4fb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HYPHA_HINDSIGHT_API_PORT:-8888}:8888'
      - '127.0.0.1:${HYPHA_HINDSIGHT_UI_PORT:-9999}:9999'
    environment:
      HINDSIGHT_API_WORKER_ID: hypha-hindsight-local-v1
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4.1-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set HINDSIGHT_API_LLM_API_KEY}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'

volumes:
  hindsight-data:
